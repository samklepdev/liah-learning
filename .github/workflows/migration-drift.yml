name: Migration drift check

on:
  pull_request:
    paths:
      - 'backend/src/models/schema.ts'
      - 'backend/drizzle/**'

jobs:
  check:
    name: Schema matches committed migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate migrations from the current schema
        working-directory: backend
        run: npx drizzle-kit generate
        env:
          # drizzle-kit generate only diffs schema.ts against drizzle/meta's
          # snapshots — it never connects — but drizzle.config.ts requires
          # DATABASE_URL to be set to something.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Fail if generating produced an uncommitted migration
        run: |
          if [ -n "$(git status --porcelain backend/drizzle)" ]; then
            echo "::error::schema.ts changed without a committed migration. Run 'npm run db:generate -w backend' and commit the result."
            git status --porcelain backend/drizzle
            exit 1
          fi
